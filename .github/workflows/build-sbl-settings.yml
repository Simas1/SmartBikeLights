name: Build SBL Settings
run-name: Build SBL Settings

on:
  workflow_dispatch:
    inputs:
      RL:
        description: Record lights mode
        type: boolean
        required: false
        default: true
      IL:
        description: Invert lights
        type: boolean
        required: false
        default: false
      TO:
        description: Text Only
        type: boolean
        required: false
        default: false
      TH:
        description: Theme
        type: choice
        required: false
        default: 'Blue'
        options:
          - Blue
          - Violet
          - Mint
      CC:
        description: Current Configuration
        type: choice
        required: false
        default: 'Primary'
        options:
          - Primary
          - Secondary
          - Tertiary
      LC:
        description: Lights Configuration (paste the configurator output)
        type: string
        required: false
        default: '#16384,90382865:1,2147483647:1:267911168,0#5,3!Night:2:51:60:0Es0,r0H]2!Day:2:0:60:0Er0,s0H]2!:1:0:0:0D=1#6291461,1409482753:0,889104606:1:#11,5!BreakD:3:1:5:0Er0,s0H]2A[-20!BreakN:3:5:5:0Es0,r0H]2A[-20!Day:2:8:60:0Er0,s0H]2!Night:2:63:60:0Es0,r0H]2!:1:0:0:0D=1#6,5:AT 1600:0:16777215:0!2,:-1,Off:0!1,Low\n200lm-12h\n@headlight-low:51!1,Medium\n600lm-4h\n@headlight-medium:52!1,High\n1200lm-2h\n@headlight-high:53!1,:-2#6,5:Flare RT:0:16777215:0!2,:-1,Off:0!1,Night Flash\n5lm-15h\n@lightning:63!1,Day Flash\n45lm-12h\n@lightning:8!1,Night Steady\n5lm-13.5h\n@moon:5!1,Day Steady\n25lm-4.5h\n@sun:1#0::#0:0#123!:123!#0#0##B3843#14#1#0#0'
      CN1:
        description: Lights Configuration Name
        type: string
        required: false
        default: 'Flash Config'
      LC2:
        description: Secondary Lights Configuration
        type: string
        required: false
        default: '#16384,90382865:1,2147483647:1:267911168,0#5,3!Night:2:51:60:0Es0,r0H]2!Day:2:0:60:0Er0,s0H]2!:1:0:0:0D=1#6291461,1409482753:0,889104606:1:#11,5!BreakD:3:7:5:0Er0,s0H]2A[-20!BreakN:3:63:5:0Es0,r0H]2A[-20!Day:2:5:60:0Er0,s0H]2!Night:2:5:60:0Es0,r0H]2!:1:0:0:0D=1#6,5:AT 1600:0:16777215:0!2,:-1,Off:0!1,Low\n200lm-12h:51!1,Medium\n600lm-4h:52!1,High\n1200lm-2h:53!1,:-2#6,5:Flare RT:0:16777215:0!2,:-1,Off:0!1,Night Flash\n5lm-15h:63!1,Day Flash\n45lm-12h:8!1,Night Steady\n5lm-13.5h:5!1,Day Steady\n25lm-4.5h:1#0::#0:0#123!:123!#0#0#B3843#14#1#0#0'
      CN2:
        description: Secondary Lights Configuration Name
        type: string
        required: false
        default: 'Steady Config'
      LC3:
        description: Tertiary Lights Configuration
        type: string
        required: false
        default: '#16384,90382865:1,2147483647:1:267911168,0#1,1!:1:0:0:0D=1#6291461,1409482753:0,889104606:1:#7,3!BreakD:3:7:5:0Er0,s0H]2A[-20!BreakN:3:63:5:0Es0,r0H]2A[-20!:1:0:0:0D=1#6,5:AT 1600:0:16777215:0!2,:-1,Off:0!1,Low\n200lm-12h:51!1,Medium\n600lm-4h:52!1,High\n1200lm-2h:53!1,:-2#6,5:Flare RT:0:16777215:0!2,:-1,Off:0!1,Night Flash\n5lm-15h:63!1,Day Flash\n45lm-12h:8!1,Night Steady\n5lm-13.5h:5!1,Day Steady\n25lm-4.5h:1#0::#0:0#123!:123!#0#0#B3843#14#1#0#0'
      CN3:
        description: Tertiary Lights Configuration Name
        type: string
        required: false
        default: 'Break Config'

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build settings file
        uses: ./.github/actions/build-sbl-settings
        with:
          settings: ${{ toJSON(inputs) }}

      - name: Upload Garmin settings
        uses: actions/upload-artifact@v7
        with:
          name: SmartBikeLights-settings
          path: Build/settings/SmartBikeLights.SET
          if-no-files-found: error
          retention-days: 7

      - name: Show installation instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## SmartBikeLights settings
          Download **SmartBikeLights-settings** and unzip it.
          Back up the existing settings, then copy **SmartBikeLights.SET** into
          **GARMIN/APPS/SETTINGS**, matching the installed application's filename.
          Safely disconnect and restart the Garmin.

          This file replaces all eleven app settings. It does not rebuild the app.
          The Build SBL workflow produces the separate application file.
          EOF
