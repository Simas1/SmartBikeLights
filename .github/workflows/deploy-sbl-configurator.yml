name: Deploy Configurator
run-name: Deploy Configurator

on:
  push:
    branches: [master]
    paths:
      - 'Source/light-configurator/**'
      - '.github/workflows/deploy-sbl-configurator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Source/light-configurator/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: Source/light-configurator
      - run: npm run build-datafield
        working-directory: Source/light-configurator
        env:
          GENERATE_SOURCEMAP: 'false'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Source/light-configurator/build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
