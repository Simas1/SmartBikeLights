name: Build Edge 1040

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge1040-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build sideloadable data field
        run: bash scripts/build-edge1040.sh

      - name: Upload Garmin application
        uses: actions/upload-artifact@v4
        with:
          name: SmartBikeLights-edge1040
          path: Build/edge1040/SmartBikeLights.prg
          if-no-files-found: error
          retention-days: 7

      - name: Show installation instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Edge 1040 build
          Download **SmartBikeLights-edge1040** from this run's artifacts and unzip it.
          Copy **SmartBikeLights.prg** to **GARMIN/APPS** on your USB-connected Edge 1040, then eject and unplug it.

          This build uses the configuration defaults in the selected revision of the repository.
          Existing saved settings override those defaults.
          See docs/edge1040-build.md in the repository for details.
          EOF
